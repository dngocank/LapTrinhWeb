<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="case-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>
  <!-- Phone Silhouette Inside Case -->
  <g filter="url(#drop)">
    <!-- Clear Case Outer Bumper -->
    <rect x="130" y="50" width="140" height="260" rx="32" fill="url(#case-body)" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Clear Glass Shine -->
    <path d="M135 65 L220 65 L170 300 L135 300 Z" fill="#ffffff" opacity="0.35"/>
    <!-- Camera Plateau Cutout -->
    <rect x="142" y="62" width="60" height="60" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="157" cy="77" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="187" cy="77" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="172" cy="104" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <!-- MagSafe Magnet Ring -->
    <circle cx="200" cy="185" r="42" fill="none" stroke="#e2e8f0" stroke-width="5"/>
    <circle cx="200" cy="185" r="42" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 4"/>
    <!-- MagSafe Alignment Bar -->
    <rect x="198" y="235" width="4" height="20" rx="2" fill="#94a3b8"/>
  </g>
  <text x="200" y="345" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Ốp lưng iPhone 16 Pro Max MagSafe</text>
  <text x="200" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Trong Suốt Chống Ố Vàng Chính Hãng</text>
  <!-- Spec Badge -->
  <rect x="155" y="375" width="90" height="18" rx="9" fill="#f5f3ff"/>
  <text x="200" y="388" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle">🧲 MagSafe Built-in</text>
</svg>
